name: Verificar e publicar o Rosarium

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - 'rosarium.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'rosarium.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verificar o site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verificar JavaScript
        run: |
          for script in assets/js/*.js; do
            node --check "$script"
          done
          node --check sw.js

      - name: Validar HTML
        run: npx --yes html-validate@11.19.0 --preset standard --max-warnings 0 index.html

      - name: Verificar conteúdo, fontes e acesso offline
        run: node --test scripts/*.test.cjs

      - name: Verificar arquivos e caminhos locais
        run: python3 scripts/check_site.py

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter os arquivos aprovados
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Separar os arquivos públicos
        run: |
          mkdir _site
          cp index.html rosarium.md rosary.svg sw.js _site/
          cp -R assets _site/assets

      - name: Enviar o site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
